<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>para: chule💗</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Pantalla 1 -->
  <div id="intro" class="screen">
    <h1>chule… 🥹</h1>
    <p>tengo algo muy importante que preguntarte...</p>
    <button onclick="goToQuestion()">Continuar 💌</button>

  <!-- Pantalla 2 -->
  <div id="question" class="screen hidden">
    <h1>¿quieres ser mi San Valentín? 💖</h1>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">SI 😊</button>

  </div>

  <!-- Pantalla 3 -->

    <h2 class="virtual-date">
      ahora que eres mi San Valentín…
      <br>
      ¿aceptas una cita virtual conmigo este Sabado 14 de Febrero? 🥹
    </h2>

    <p>mira somos nosotros! 🥰</p>
    <img src="foto2.jpeg" alt="Nosotros felices" class="main-photo small-photo">

    <img src="gato.gif" alt="Gato UIAUIA" class="meme">
  </div>

  <script src="script.js"></script>
  <div id="hearts-container"></div>
  <div id="star-container"></div>
